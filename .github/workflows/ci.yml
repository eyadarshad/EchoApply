name: CI Test Runner

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # WeasyPrint requires system-level packages on Linux (libpango, libjpeg, etc.)
          sudo apt-get update
          sudo apt-get install -y libpango1.0-0 libpangoft2-1.0-0 libjpeg-dev libopenjp2-7-dev libgirepository1.0-dev tesseract-ocr
          pip install -r backend/requirements.txt

      - name: Run Pytest
        run: |
          pytest backend/tests/

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest
        run: |
          cd frontend
          npm run test
