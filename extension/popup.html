<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      text-align: center;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #6366f1;
      margin: 0;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input {
      background: #020617;
      border: 1px solid #1e293b;
      color: #f1f5f9;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input:focus {
      border-color: #6366f1;
    }
    .btn {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      font-size: 11px;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Antigravity Sync Gateway</h1>
      <p class="subtitle">Secure session cookie sync worker</p>
    </div>

    <div class="field">
      <label class="label">User Profile Identifier</label>
      <input type="text" id="userIdInput" class="input" placeholder="Enter your User ID" />
    </div>

    <button id="syncBtn" class="btn">Sync Sessions Now</button>

    <div id="statusBox" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
